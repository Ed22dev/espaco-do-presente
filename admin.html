<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Espaço do Presente</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #ff69b4;
    --rosa-escuro: #ff1493;
    --rosa-suave: #fff0f7;
    --preto: #0f0f0f;
    --branco: #ffffff;
    --cinza: #f5f5f5;
    --borda: #f0d6e8;
    --sombra: 0 4px 24px rgba(255,105,180,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Montserrat',sans-serif; background:#fdf6fa; min-height:100vh; }

  /* ── LOGIN ── */
  #tela-login {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#fff0f7 0%,#ffe4f2 100%);
  }
  .login-box {
    background:var(--branco); border-radius:24px; padding:56px 48px;
    box-shadow:0 20px 60px rgba(255,20,147,0.13); text-align:center; width:360px;
  }
  .login-box h1 { font-family:'Cinzel',serif; font-size:1.3rem; color:var(--preto); margin-bottom:6px; }
  .login-box p  { font-size:0.8rem; color:#aaa; margin-bottom:32px; letter-spacing:1px; }
  .login-box input {
    width:100%; padding:14px 18px; border:1.5px solid var(--borda);
    border-radius:50px; font-size:0.95rem; font-family:'Montserrat',sans-serif;
    outline:none; margin-bottom:14px; transition:.2s;
  }
  .login-box input:focus { border-color:var(--rosa); }
  .login-box button {
    width:100%; padding:14px; background:linear-gradient(135deg,var(--rosa-escuro),#ff8fb3);
    color:#fff; border:none; border-radius:50px; font-weight:600; font-size:0.95rem;
    cursor:pointer; transition:.2s; font-family:'Montserrat',sans-serif;
  }
  .login-box button:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,20,147,.3); }
  #erro-login { color:#e53; font-size:0.8rem; margin-top:10px; display:none; }

  /* ── PAINEL ── */
  #painel { display:none; }
  header {
    background:var(--preto); color:var(--branco); padding:18px 40px;
    display:flex; justify-content:space-between; align-items:center;
  }
  header h1 { font-family:'Cinzel',serif; font-size:1.1rem; color:var(--rosa); }
  header span { font-size:0.8rem; color:#888; }
  .btn-sair {
    background:none; border:1px solid #444; color:#aaa; padding:6px 18px;
    border-radius:50px; cursor:pointer; font-size:0.8rem; font-family:'Montserrat',sans-serif;
    transition:.2s;
  }
  .btn-sair:hover { border-color:var(--rosa); color:var(--rosa); }

  .admin-grid {
    display:grid; grid-template-columns:400px 1fr; gap:32px;
    max-width:1200px; margin:40px auto; padding:0 32px;
  }

  /* ── FORMULÁRIO ── */
  .form-card {
    background:var(--branco); border-radius:20px; padding:32px;
    box-shadow:var(--sombra); border:0.5px solid var(--borda); height:fit-content;
  }
  .form-card h2 { font-family:'Cinzel',serif; font-size:1rem; color:var(--preto); margin-bottom:24px; }
  label { display:block; font-size:0.75rem; font-weight:600; color:#888; margin-bottom:5px; letter-spacing:.5px; }
  .form-card input, .form-card select {
    width:100%; padding:11px 16px; border:1.5px solid var(--borda);
    border-radius:12px; font-size:0.9rem; font-family:'Montserrat',sans-serif;
    outline:none; margin-bottom:16px; transition:.2s; background:var(--cinza);
  }
  .form-card input:focus, .form-card select:focus { border-color:var(--rosa); background:#fff; }

  /* Upload de imagem */
  .upload-area {
    border:2px dashed var(--borda); border-radius:12px; padding:24px;
    text-align:center; cursor:pointer; transition:.2s; margin-bottom:16px;
    position:relative;
  }
  .upload-area:hover { border-color:var(--rosa); background:var(--rosa-suave); }
  .upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-area .icon { font-size:2rem; display:block; margin-bottom:6px; }
  .upload-area p { font-size:0.8rem; color:#aaa; }
  #preview-img {
    width:100%; height:160px; object-fit:cover; border-radius:10px;
    margin-bottom:16px; display:none; border:1.5px solid var(--borda);
  }

  .btn-salvar {
    width:100%; padding:14px; background:linear-gradient(135deg,var(--rosa-escuro),#ff8fb3);
    color:#fff; border:none; border-radius:50px; font-weight:700; font-size:0.95rem;
    cursor:pointer; font-family:'Montserrat',sans-serif; transition:.2s;
  }
  .btn-salvar:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,20,147,.3); }
  #msg-salvo { text-align:center; color:#1a9e5c; font-size:0.85rem; margin-top:10px; display:none; font-weight:600; }

  /* ── LISTA DE PRODUTOS ── */
  .lista-card {
    background:var(--branco); border-radius:20px; padding:32px;
    box-shadow:var(--sombra); border:0.5px solid var(--borda);
  }
  .lista-top {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  }
  .lista-card h2 { font-family:'Cinzel',serif; font-size:1rem; color:var(--preto); }
  .total-badge {
    background:var(--rosa-suave); color:var(--rosa-escuro); font-size:0.8rem;
    font-weight:700; padding:4px 14px; border-radius:50px;
  }
  #busca-admin {
    width:100%; padding:10px 16px; border:1.5px solid var(--borda); border-radius:12px;
    font-size:0.9rem; font-family:'Montserrat',sans-serif; outline:none; margin-bottom:16px;
    transition:.2s;
  }
  #busca-admin:focus { border-color:var(--rosa); }

  .produto-item {
    display:flex; align-items:center; gap:14px; padding:14px;
    border:0.5px solid var(--borda); border-radius:14px; margin-bottom:10px;
    transition:.2s;
  }
  .produto-item:hover { border-color:var(--rosa); background:var(--rosa-suave); }
  .produto-item img { width:60px; height:60px; object-fit:cover; border-radius:10px; flex-shrink:0; }
  .prod-info { flex:1; min-width:0; }
  .prod-nome { font-weight:600; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prod-meta { font-size:0.75rem; color:#aaa; margin-top:2px; }
  .prod-preco { font-weight:700; color:var(--rosa-escuro); font-size:0.95rem; white-space:nowrap; }
  .btn-excluir {
    background:none; border:1px solid #f0c0c0; color:#e53; padding:5px 12px;
    border-radius:50px; cursor:pointer; font-size:0.75rem; font-family:'Montserrat',sans-serif;
    transition:.2s; white-space:nowrap;
  }
  .btn-excluir:hover { background:#ffe0e0; }
  .vazio { text-align:center; color:#ccc; padding:40px; font-size:0.9rem; }

  /* Responsivo */
  @media(max-width:900px) {
    .admin-grid { grid-template-columns:1fr; padding:0 16px; }
    header { padding:16px 20px; }
  }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <h1>Espaço do Presente</h1>
    <p>ÁREA RESTRITA — ADMIN</p>
    <input type="password" id="input-senha" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <div id="erro-login">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<!-- PAINEL ADMIN -->
<div id="painel">
  <header>
    <h1>Painel Admin — Espaço do Presente</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="contagem-header"></span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="admin-grid">

    <!-- FORMULÁRIO -->
    <div class="form-card">
      <h2>Adicionar Produto</h2>

      <label>Nome do produto</label>
      <input type="text" id="f-nome" placeholder="Ex: Loção Corporal Rosé">

      <label>Marca</label>
      <select id="f-marca">
        <option value="boticario">O Boticário</option>
        <option value="natura">Natura</option>
        <option value="outros">Outros</option>
      </select>

      <label>Categoria</label>
      <select id="f-categoria">
        <option value="infantil">Infantil</option>
        <option value="corpo">Corpo e Banho</option>
        <option value="make">Makes</option>
        <option value="perfume">Perfumes</option>
      </select>

      <label>Preço (R$)</label>
      <input type="number" id="f-preco" placeholder="Ex: 89.90" step="0.01" min="0">

      <label>Estoque (unidades)</label>
      <input type="number" id="f-estoque" placeholder="Ex: 5" min="0">

      <label>Descrição breve</label>
      <input type="text" id="f-descricao" placeholder="Ex: Hidratante suave com aroma floral">

      <label>Foto do produto</label>
      <img id="preview-img" src="" alt="Preview">
      <div class="upload-area" id="upload-area">
        <input type="file" accept="image/*" onchange="carregarFoto(event)">
        <span class="icon">📷</span>
        <p>Clique ou arraste a foto aqui</p>
      </div>

      <button class="btn-salvar" onclick="salvarProduto()">Salvar produto</button>
      <div id="msg-salvo">✓ Produto salvo com sucesso!</div>
    </div>

    <!-- LISTA -->
    <div class="lista-card">
      <div class="lista-top">
        <h2>Produtos cadastrados</h2>
        <span class="total-badge" id="total-badge">0 produtos</span>
      </div>
      <input type="text" id="busca-admin" placeholder="Buscar produto..." oninput="renderLista()">
      <div id="lista-produtos"><div class="vazio">Nenhum produto ainda.</div></div>
    </div>

  </div>
</div>

<script>
// ──────────────────────────────────────────────
// CONFIGURAÇÃO — altere a senha aqui
const SENHA_ADMIN = "espacodopresente2024";
const CHAVE_STORAGE = "ep_produtos";
// ──────────────────────────────────────────────

let fotoBase64 = "";

/* LOGIN */
function entrar() {
  const v = document.getElementById("input-senha").value;
  if (v === SENHA_ADMIN) {
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("painel").style.display = "block";
    renderLista();
  } else {
    const el = document.getElementById("erro-login");
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 3000);
  }
}

function sair() {
  document.getElementById("tela-login").style.display = "flex";
  document.getElementById("painel").style.display = "none";
  document.getElementById("input-senha").value = "";
}

/* FOTO */
function carregarFoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    fotoBase64 = ev.target.result;
    const prev = document.getElementById("preview-img");
    prev.src = fotoBase64;
    prev.style.display = "block";
    document.getElementById("upload-area").style.display = "none";
  };
  reader.readAsDataURL(file);
}

/* SALVAR PRODUTO */
function salvarProduto() {
  const nome     = document.getElementById("f-nome").value.trim();
  const marca    = document.getElementById("f-marca").value;
  const categoria= document.getElementById("f-categoria").value;
  const preco    = parseFloat(document.getElementById("f-preco").value);
  const estoque  = parseInt(document.getElementById("f-estoque").value);
  const descricao= document.getElementById("f-descricao").value.trim();

  if (!nome || isNaN(preco)) {
    alert("Preencha pelo menos o nome e o preço.");
    return;
  }

  const produtos = getProdutos();
  const novoProd = {
    id: Date.now(),
    nome, marca, categoria,
    preco: preco.toFixed(2),
    estoque: estoque || 0,
    descricao,
    foto: fotoBase64 || "https://via.placeholder.com/300x300?text=Sem+Foto"
  };
  produtos.push(novoProd);
  salvarStorage(produtos);
  limparForm();
  renderLista();
  const msg = document.getElementById("msg-salvo");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2500);
}

function limparForm() {
  ["f-nome","f-preco","f-estoque","f-descricao"].forEach(id => document.getElementById(id).value = "");
  fotoBase64 = "";
  document.getElementById("preview-img").style.display = "none";
  document.getElementById("upload-area").style.display = "block";
}

/* STORAGE */
function getProdutos() {
  try { return JSON.parse(localStorage.getItem(CHAVE_STORAGE)) || []; }
  catch(e) { return []; }
}
function salvarStorage(arr) {
  localStorage.setItem(CHAVE_STORAGE, JSON.stringify(arr));
}

/* LISTA */
function renderLista() {
  const busca = (document.getElementById("busca-admin")?.value || "").toLowerCase();
  const todos = getProdutos();
  const filtrados = busca ? todos.filter(p =>
    p.nome.toLowerCase().includes(busca) ||
    p.categoria.toLowerCase().includes(busca) ||
    p.marca.toLowerCase().includes(busca)
  ) : todos;

  const el = document.getElementById("lista-produtos");
  const badge = document.getElementById("total-badge");
  const header = document.getElementById("contagem-header");
  badge.textContent  = `${todos.length} produto${todos.length !== 1 ? "s" : ""}`;
  if(header) header.textContent = `${todos.length} produto${todos.length !== 1 ? "s" : ""}`;

  if (!filtrados.length) {
    el.innerHTML = `<div class="vazio">${todos.length ? "Nenhum produto encontrado." : "Nenhum produto ainda."}</div>`;
    return;
  }

  el.innerHTML = filtrados.map(p => `
    <div class="produto-item">
      <img src="${p.foto}" alt="${p.nome}">
      <div class="prod-info">
        <div class="prod-nome">${p.nome}</div>
        <div class="prod-meta">${p.categoria} · ${p.marca} · ${p.estoque} un</div>
        ${p.descricao ? `<div class="prod-meta">${p.descricao}</div>` : ""}
      </div>
      <div class="prod-preco">R$ ${p.preco}</div>
      <button class="btn-excluir" onclick="excluir(${p.id})">Excluir</button>
    </div>
  `).join("");
}

function excluir(id) {
  if (!confirm("Tem certeza que quer excluir este produto?")) return;
  const atualizado = getProdutos().filter(p => p.id !== id);
  salvarStorage(atualizado);
  renderLista();
}
</script>
</body>
</html>
